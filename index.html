<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and Span Demo</title>

    <style>
     
        .header {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }

        .content {
            background-color: lightgray;
            padding: 20px;
            margin-top: 10px;
        }

        .footer {
            background-color: darkblue;
            color: white;
            padding: 15px;
            text-align: center;
            margin-top: 10px;
        }

       
        .highlight {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    
    <div class="header">
        <h1>Div and Span Elements</h1>
        <p>Example of using <span class="highlight">HTML elements</span>.</p>
    </div>


    <div class="content">
        <h2>About Div</h2>
        <p>
            The <span class="highlight">&lt;div&gt;</span> element is used
            to group and organize larger sections of content.
        </p>

        <h2>About Span</h2>
        <p>
            The <span class="highlight">&lt;span&gt;</span> element is used
            to style or group a small portion of text within a line.
        </p>
    </div>

    
    <div class="footer">
        <p>&copy; 2026 HTML Demo</p>
    </div>

</body>
</html>
