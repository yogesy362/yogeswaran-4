name: GitHub Classroom Autograding

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  autograding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run All Jest Tests
        run: npx jest --runInBand
